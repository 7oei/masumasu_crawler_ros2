crawler_driver:
  ros__parameters:
    # Prefer fixed aliases, otherwise identify the original controllers by serial.
    odrive0_usb_path: "auto"
    odrive1_usb_path: "auto"
    # Legacy unframed query timeout; framed queries use ascii_resync_timeout.
    cmd_vel_timeout: 0.5
    ascii_timeout: 5.0
    # Bracket every reply with fresh volatile test_property markers. Additional
    # marker reads release delayed CDC output without repeating the query.
    ascii_query_retries: 1
    ascii_invalid_response_retries: 1
    ascii_resync_enabled: true
    # Recovery stays bounded; failure stops the driver and reopens both ports.
    ascii_resync_timeout: 0.15
    connect_retry_delay: 0.5
    # A ttyACM node can appear before a re-enumerated ODrive is ready.
    usb_settle_delay: 1.5
    closed_loop_timeout: 2.0
    closed_loop_poll_period: 0.1
    # Each `v` setpoint feeds its axis watchdog. Bounded telemetry polls pause
    # setpoints, then resume them before the 0.5 s watchdog deadline.
    watchdog_test_enabled: true
    watchdog_test_timeout: 0.5
    watchdog_test_check_period: 1.0
    # Compatibility setting for the legacy query-wait callback.
    watchdog_query_wait_feed_period: 0.1
    # The legacy CDC cannot reliably return query responses while watchdog
    # feed writes share the port. Keep bulk runtime queries disabled.
    # Wheel feedback and voltage reads briefly own both ports, without blocking
    # ROS or mixing velocity writes into a pending reply. Bulk queries stay off.
    runtime_ascii_queries_enabled: false
    voltage_query_timeout: 0.15
    wheel_feedback_rate: 10.0
    tread: 0.8
    reduction: 26.4
    drive_wheel_teeth: 8.0
    crawler_teeth: 46.0
    crawler_perimeter: 3.312
    linear_vel_limit: 0.47
    angular_vel_limit: 0.5
    yaw_calibration: 1.875
    voltage_min: 22.2
    current_max: 100.0
    # Control timer rate; pending telemetry temporarily pauses velocity writes.
    control_rate: 30.0
    power_telemetry_rate: 2.0
    # The ROS 1 driver unconditionally bypassed these limits. Keep protection
    # enabled by default for ROS 2; override only after validating the hardware.
    bypass_emergency_limits: false

crawler_odometry:
  ros__parameters:
    odom_frame: odom
    base_frame: base_footprint
    publish_tf: true

crawler_teleop:
  ros__parameters:
    linear_axis: 1
    angular_axis: 3
    max_linear: 0.47
    max_angular: 0.5
    joy_timeout: 0.5
    acceleration_rate: 40.0
