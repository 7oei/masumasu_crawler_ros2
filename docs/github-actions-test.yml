name: ROS 2 Humble
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-pytest
          rosdep update
          rosdep install --from-paths src --ignore-src --rosdistro humble -r -y
      - name: Build and test without hardware
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select masumasu_crawler
          source install/setup.bash
          python3 -m pytest src/masumasu_crawler/test -q
          ROS_DOMAIN_ID=187 ROS_LOCALHOST_ONLY=1 python3 src/masumasu_crawler/test/integration_ros.py
